<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>鳌太穿越 · 极限省钱</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a222c;
    --line: #2a3644;
    --text: #e7eef6;
    --muted: #8b9aab;
    --accent: #e8a54b;
    --good: #5dbe8a;
    --bad: #e06c75;
    --water: #5dade2;
    --camp: #c9a66b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: #121820;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  header .meta b { color: var(--accent); font-weight: 600; }
  .layout {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    grid-template-rows: 1fr;
    height: calc(100vh - 48px);
    height: calc(100dvh - 48px);
  }
  .map-pane { border-right: 1px solid var(--line); }
  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(34vh, 40vh) 1fr;
    }
    .map-pane {
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    header {
      padding: 8px 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    header h1 { font-size: 14px; }
    header .meta { font-size: 12px; gap: 8px; }
    #log { padding: 10px 12px; font-size: 13px; }
    .actions { padding: 8px; gap: 6px; }
    button { padding: 10px 12px; font-size: 13px; min-height: 40px; }
    .map-legend { font-size: 10px; }
  }
  .map-pane { position: relative; background: #0c1015; min-height: 0; }
  .map-pane svg { width: 100%; height: 100%; display: block; }
  .map-legend {
    position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 6px; line-height: 1.5;
  }
  .game-pane { display: flex; flex-direction: column; min-height: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 14px 16px; font-size: 14px; line-height: 1.55;
  }
  #log .sys { color: var(--muted); }
  #log .evt { color: var(--accent); }
  #log .bad { color: var(--bad); }
  #log .good { color: var(--good); }
  #log p { margin: 0 0 10px; }
  .actions {
    border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--panel);
  }
  button {
    background: #243040; color: var(--text); border: 1px solid #334556; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #3a2e1a; border-color: #6b5228; color: var(--accent); }
  button.danger { background: #2a1a1c; border-color: #5a3036; color: #f0a0a8; }
  .ach-toast {
    position: fixed; right: 16px; top: 56px; background: #1e2a20; border: 1px solid #3d6b4f;
    color: var(--good); padding: 10px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; transform: translateY(-6px); transition: .25s; pointer-events: none; z-index: 9;
  }
  .ach-toast.show { opacity: 1; transform: none; }
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; width: min(480px, 92vw); max-height: 85vh; overflow: auto;
  }
  .modal h2 { margin: 0 0 10px; font-size: 18px; }
  .modal ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .modal li.got { color: var(--good); }
  .shop-grid { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .shop-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px;
  }
  .shop-row .info { flex: 1; color: var(--muted); line-height: 1.4; }
  .shop-row .info b { color: var(--text); }
  .shop-row.owned { border-color: #3d6b4f; opacity: .85; }
</style>
</head>
<body>
<header>
  <h1>鳌太穿越 · 极限省钱</h1>
  <div class="meta">
    <span>现金 <b id="mMoney">—</b></span>
    <span>体力 <b id="mStam">—</b></span>
    <span>干粮 <b id="mFood">—</b></span>
    <span>水 <b id="mWater">—</b></span>
    <span>负重 <b id="mWeight">—</b></span>
    <span>天气 <b id="mWeather">—</b></span>
    <span>日 <b id="mDay">—</b></span>
  </div>
<input type="file" id="bgmFile" accept="audio/*" style="display:none" />
</header>
<div class="layout">
  <div class="map-pane">
    <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="map-legend">鳌山→太白 单向 · ▶ 行进方向 · ● 当前 · ○ 营地 · ◇ 水源 · 虚线=下撤<br/>纵轴示意海拔，横轴示意里程（非精确测绘）</div>
  </div>
  <div class="game-pane">
    <div id="log"></div>
    <div class="actions" id="actions"></div>
  </div>
</div>
<div class="ach-toast" id="toast"></div>
<div class="modal-bg show" id="shopModal">
  <div class="modal">
    <h2>塘口村 · 出发前采购</h2>
    <p style="font-size:13px;color:var(--muted);margin:0 0 8px">你带着 ¥600 和基础补给。尽量省钱，但鳌太天气翻脸极快——适当装备能保命。买完点「出发」。</p>
    <p style="font-size:13px;margin:0 0 4px">剩余现金：<b id="shopMoney">600</b> · 负重：<b id="shopWeight">0</b> kg</p>
    <div class="shop-grid" id="shopGrid"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="primary" onclick="finishShop()">出发上山</button>
      <button onclick="showAchievements()">成就</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="endModal">
  <div class="modal">
    <h2 id="endTitle"></h2>
    <p id="endBody" style="font-size:14px;line-height:1.5"></p>
    <ul id="endAchs"></ul>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" onclick="location.reload()">再来一局</button>
      <button onclick="showAchievements()">成就一览</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="achModal">
  <div class="modal">
    <h2>成就</h2>
    <ul id="achList"></ul>
    <div style="margin-top:14px"><button onclick="document.getElementById('achModal').classList.remove('show')">关闭</button></div>
  </div>
</div>
<script>
let DATA = { points: [], retreats: {} };
let GAME = { shop: [], gear: {}, emergencies: [] };

const WEATHERS = {
  clear: { id: "clear", name: "晴", mult: 1, stam: 0 },
  cloud: { id: "cloud", name: "多云", mult: 1.05, stam: 1 },
  fog: { id: "fog", name: "浓雾", mult: 1.25, stam: 4 },
  rain: { id: "rain", name: "雨", mult: 1.35, stam: 6 },
  heavy_rain: { id: "heavy_rain", name: "暴雨", mult: 1.55, stam: 10 },
  snow: { id: "snow", name: "阵雪", mult: 1.4, stam: 7 },
  blizzard: { id: "blizzard", name: "暴雪", mult: 1.85, stam: 14 },
  whiteout: { id: "whiteout", name: "白茫", mult: 1.7, stam: 12 },
  gale: { id: "gale", name: "狂风", mult: 1.45, stam: 9 },
  storm: { id: "storm", name: "雷暴", mult: 1.75, stam: 16 },
};

const ACH_DEFS = {
  first_step: { title: "踏上鳌山", desc: "离开塘口村" },
  peak: { title: "站上拔仙台", desc: "抵达太白最高点" },
  clear_cheap: { title: "极限省钱通关", desc: "正向抵达鹦鸽且剩余≥400" },
  clear_any: { title: "走完主线", desc: "正向抵达鹦鸽镇" },
  retreat_ok: { title: "明智下撤", desc: "任意下撤口安全出山（Good Ending）" },
  retreat_explorer: { title: "下撤拓荒者", desc: "同一存档发现全部 6 条下撤路径" },
  storm_survive: { title: "风暴行者", desc: "在雷暴/暴雪下成功移动一段" },
  no_buy: { title: "苦行僧", desc: "全程未在补给点花钱并通关或下撤成功" },
  camp_10: { title: "梁上露宿", desc: "累计扎营 5 次" },
  blizzard_live: { title: "雪中行", desc: "遭遇暴雪并活着走完该段" },
};

let S;

function buildRetreats(points) {
  const retreats = {};
  points.forEach((p, i) => { if (p.retreat) retreats[String(p.id)] = p.retreat; });
  return retreats;
}

async function loadGameFiles() {
  try {
    const [pts, gd] = await Promise.all([
      fetch("points.json").then(r => r.json()),
      fetch("game-data.json").then(r => r.json()),
    ]);
    DATA.points = pts;
    DATA.retreats = buildRetreats(pts);
    GAME = gd;
  } catch (e) {
    console.warn("fetch failed, using inline fallback", e);
    await loadInlineFallback();
  }
}

async function loadInlineFallback() {
  const pts = await fetch("points.json").catch(() => null);
  if (pts && pts.ok) {
    DATA.points = await pts.json();
    DATA.retreats = buildRetreats(DATA.points);
  }
  GAME = {
    shop: [],
    gear: {},
    emergencies: [
      { id: "blizzard", name: "暴雪", weather: "blizzard", minRisk: 3, weight: 1, stam: 14, mult: 0.35, log: "狂风卷雪，能见度骤降。" },
    ],
  };
}

function loadAch() {
  try { return JSON.parse(localStorage.getItem("aotai_achs") || "{}"); } catch { return {}; }
}
function saveAch(a) { localStorage.setItem("aotai_achs", JSON.stringify(a)); }

function unlock(id) {
  const a = loadAch();
  if (a[id]) return;
  a[id] = true;
  saveAch(a);
  S.unlockedThisRun.add(id);
  const t = document.getElementById("toast");
  t.textContent = "成就：" + ACH_DEFS[id].title;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function log(html, cls="") {
  const el = document.getElementById("log");
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.innerHTML = html;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

function cur() { return DATA.points[S.idx]; }

function hasGear(id) {
  const g = S.gear[id];
  if (!g) return false;
  if (g.uses !== undefined && g.uses <= 0) return false;
  return true;
}

function gearUsesLeft(id) {
  const g = S.gear[id];
  if (!g || g.uses === undefined) return 99;
  return g.uses;
}

function totalWeightKg() {
  let w = S.baseWeight || 0;
  Object.values(S.gear).forEach(g => { w += g.weight || 0; });
  return Math.round(w * 10) / 10;
}

function weightStamPenalty() {
  const w = totalWeightKg();
  if (w <= 8) return 0;
  if (w <= 12) return 2;
  if (w <= 16) return 5;
  return 8;
}

function mitigationFor(weatherId) {
  let stamR = 0, multR = 0;
  Object.keys(S.gear).forEach(gid => {
    if (!hasGear(gid)) return;
    const def = GAME.gear[gid];
    if (!def) return;
    if (def.mitigate && def.mitigate.includes(weatherId)) {
      stamR += def.stamReduce || 0;
      multR += def.multReduce || 0;
    }
  });
  return { stamR, multR: Math.min(0.45, multR) };
}

function weatherPick(risk) {
  const r = Math.random() * 10 + risk;
  if (r > 13) return WEATHERS.blizzard;
  if (r > 11.5) return WEATHERS.storm;
  if (r > 10) return WEATHERS.whiteout;
  if (r > 8.5) return WEATHERS.heavy_rain;
  if (r > 7.2) return WEATHERS.gale;
  if (r > 6) return WEATHERS.snow;
  if (r > 4.8) return WEATHERS.fog;
  if (r > 3.5) return WEATHERS.rain;
  if (r > 2) return WEATHERS.cloud;
  return WEATHERS.clear;
}

function rollSuddenEmergency(risk) {
  const pool = GAME.emergencies || [];
  if (!pool.length) return null;
  const base = 0.12 + risk * 0.035;
  if (Math.random() > base) return null;
  const eligible = pool.filter(e => risk >= (e.minRisk || 1));
  if (!eligible.length) return null;
  const sum = eligible.reduce((s, e) => s + (e.weight || 1), 0);
  let pick = Math.random() * sum;
  for (const e of eligible) {
    pick -= e.weight || 1;
    if (pick <= 0) return e;
  }
  return eligible[eligible.length - 1];
}

function applyEmergency(evt, risk) {
  const wid = evt.weather || "storm";
  S.weather = WEATHERS[wid] || WEATHERS.storm;
  const mit = mitigationFor(wid);
  let extraStam = Math.max(0, Math.round((evt.stam || 10) - mit.stamR));
  const multBump = Math.max(0, (evt.mult || 0.2) * (1 - mit.multR));
  S.weather = { ...S.weather, mult: S.weather.mult + multBump };
  S.stam = Math.max(0, S.stam - extraStam);
  log(`<b>突发：${evt.name}</b> — ${evt.log}`, "bad");
  if (mit.stamR > 0) log("装备减轻了部分冲击。", "good");
  if (wid === "blizzard" || wid === "storm") {
    if (S.stam > 0) unlock("storm_survive");
    if (wid === "blizzard" && S.stam > 0) unlock("blizzard_live");
  }
  consumeGearOnEvent(wid);
}

function consumeGearOnEvent(weatherId) {
  Object.keys(S.gear).forEach(gid => {
    const def = GAME.gear[gid];
    const g = S.gear[gid];
    if (!def || !g || !def.consumable) return;
    if (def.mitigate && def.mitigate.includes(weatherId) && g.uses !== undefined) {
      g.uses--;
      if (g.uses <= 0) log(`${def.name} 已用完。`, "sys");
    }
  });
}

function canCampHere(p) {
  if (p.camp) return { ok: true, mode: "camp" };
  if (p.bivy && (hasGear("tarp") || hasGear("bivy"))) return { ok: true, mode: "bivy" };
  if (hasGear("tarp") || hasGear("bivy")) return { ok: false, reason: `「${p.name}」无固定营地；此处不宜硬宿（无平整营位）。` };
  if (p.bivy) return { ok: false, reason: `「${p.name}」可应急露宿，但需要天幕或应急 bivy。` };
  return { ok: false, reason: `「${p.name}」未标记营地，且梁顶/石海禁止过夜。` };
}

function campFoodWaterOk(hours, resting) {
  const foodNeed = hours / (resting ? 6 : 4);
  const waterNeed = hours / (resting ? 5 : 3);
  const foodShort = S.food < Math.ceil(foodNeed);
  const waterShort = S.water < Math.ceil(waterNeed);
  if (foodShort && waterShort) return "干粮和水都不足以支撑这一夜，继续走或先补给。";
  if (foodShort) return "干粮不够过夜（约需 " + Math.ceil(foodNeed) + " 份），先吃点或买粮。";
  if (waterShort) return "饮水不够过夜（约需 " + Math.ceil(waterNeed) + " 份），先取水或买水。";
  return null;
}

function refreshMeta() {
  document.getElementById("mMoney").textContent = "¥" + S.money;
  document.getElementById("mStam").textContent = S.stam + "/100";
  document.getElementById("mFood").textContent = S.food;
  document.getElementById("mWater").textContent = S.water;
  document.getElementById("mWeight").textContent = totalWeightKg() + "kg";
  document.getElementById("mWeather").textContent = S.weather.name;
  document.getElementById("mDay").textContent = S.day + " · " + S.hour.toFixed(1) + "h";
}

function segmentArrow(a, b) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  return `<g transform="translate(${mx},${my}) rotate(${ang})"><path d="M -5,-4 L 7,0 L -5,4 Z" fill="#c9a66b" opacity=".75"/></g>`;
}

function drawMap() {
  const svg = document.getElementById("map");
  const pts = DATA.points;
  if (!pts.length) return;

  let elevPath = "";
  pts.forEach((p, i) => { elevPath += (i ? " L " : "M ") + p.x + " " + p.y; });

  let segments = "";
  let arrows = "";
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const done = i < S.idx;
    const seg = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    segments += `<path d="${seg}" fill="none" stroke="${done ? "#5dbe8a" : "#3d4f5f"}" stroke-width="${done ? 3 : 2}" opacity="${done ? .9 : .55}" stroke-linecap="round"/>`;
    if (i >= S.idx - 1 && i <= S.idx + 2) arrows += segmentArrow(a, b);
  }

  let marks = "";
  pts.forEach(p => {
    if (p.retreat) {
      const ty = Math.min(680, p.y + 50);
      marks += `<line x1="${p.x}" y1="${p.y}" x2="${p.x}" y2="${ty}" stroke="#6b5228" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>`;
      marks += `<text x="${p.x}" y="${ty+11}" fill="#8b9aab" font-size="9" text-anchor="middle">撤</text>`;
    }
  });

  pts.forEach((p, i) => {
    const visited = i <= S.idx;
    const here = i === S.idx;
    const campable = p.camp || p.bivy;
    let r = here ? 7 : (campable ? 5 : 3.5);
    let fill = here ? "#e8a54b" : (visited ? "#5dbe8a" : "#4a5562");
    if (p.water && !here) {
      marks += `<polygon points="${p.x},${p.y-6} ${p.x+5},${p.y+3} ${p.x-5},${p.y+3}" fill="#5dade2" opacity=".85"/>`;
    } else {
      marks += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${fill}" stroke="#0f1419" stroke-width="1"/>`;
    }
    if (p.camp && !here) marks += `<circle cx="${p.x}" cy="${p.y}" r="7" fill="none" stroke="#c9a66b" stroke-width="1" opacity=".55"/>`;
    const showLabel = here || p.id === 1 || p.id === 29 || p.id === 36
      || (p.supply && i > S.idx - 2 && i < S.idx + 3)
      || (i % 4 === 0 && p.alt_m >= 3400);
    if (showLabel) {
      marks += `<text x="${p.x}" y="${p.y - 11}" fill="#e7eef6" font-size="9.5" text-anchor="middle">${p.name}</text>`;
      marks += `<text x="${p.x}" y="${p.y + 18}" fill="#6d8499" font-size="8" text-anchor="middle">${p.alt_m}m</text>`;
    }
  });

  const curP = pts[S.idx];
  svg.innerHTML = `
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a2838"/><stop offset="100%" stop-color="#0c1015"/>
      </linearGradient>
      <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1e3a2f" stop-opacity=".35"/><stop offset="50%" stop-color="#2a3040" stop-opacity=".25"/><stop offset="100%" stop-color="#3a2a20" stop-opacity=".3"/>
      </linearGradient>
    </defs>
    <rect width="1000" height="700" fill="url(#sky)"/>
    <rect x="30" y="520" width="940" height="160" fill="url(#ridge)" rx="8"/>
    <text x="48" y="548" fill="#5d7a6a" font-size="10">低海拔林带</text>
    <text x="48" y="90" fill="#8b9aab" font-size="10">石海·梁顶区</text>
    <text x="42" y="32" fill="#e8a54b" font-size="12">塘口（鳌山侧）</text>
    <text x="958" y="32" fill="#e8a54b" font-size="12" text-anchor="end">鹦鸽（太白侧）</text>
    <path d="${elevPath} L ${pts[pts.length-1].x} 680 L ${pts[0].x} 680 Z" fill="#1a222c" opacity=".4"/>
    ${segments}
    ${arrows}
    ${marks}
    <circle cx="${curP.x}" cy="${curP.y}" r="11" fill="none" stroke="#e8a54b" stroke-width="2" opacity=".85"/>
  `;
}

function renderActions() {
  const box = document.getElementById("actions");
  if (S.ended) {
    box.innerHTML = `<button class="primary" onclick="location.reload()">再来一局</button><button onclick="showAchievements()">成就</button>`;
    return;
  }
  const p = cur();
  const btns = [];
  if (S.idx < DATA.points.length - 1) btns.push(`<button class="primary" onclick="goNext()">前进 →</button>`);
  const campInfo = canCampHere(p);
  if (campInfo.ok) {
    const label = campInfo.mode === "bivy" ? "应急露宿" : "扎营过夜";
    btns.push(`<button onclick="camp()">${label}</button>`);
  }
  if (p.water) btns.push(`<button onclick="fillWater()">取水</button>`);
  if (p.supply) {
    if (p.price_food != null) btns.push(`<button onclick="buy('food')">买干粮 ¥${p.price_food}</button>`);
    if (p.price_water != null) btns.push(`<button onclick="buy('water')">买水 ¥${p.price_water}</button>`);
    if (p.price_rest) btns.push(`<button onclick="buy('rest')">住店过夜 ¥${p.price_rest}</button>`);
  }
  if (p.retreat) btns.push(`<button class="danger" onclick="doRetreat()">下撤：${p.retreat.name}</button>`);
  btns.push(`<button onclick="showGear()">装备</button>`);
  btns.push(`<button onclick="showAchievements()">成就</button>`);
  btns.push(`<button onclick="toggleBgm()">${S.bgmOn ? "关闭BGM" : "BGM: Ridge Tension"}</button>`);
  btns.push(`<button onclick="pickBgmFile()">选择BGM文件</button>`);
  box.innerHTML = btns.join("");
}

function tickNeeds(hours, opts = {}) {
  const resting = !!opts.resting;
  S.foodNeed += hours / (resting ? 6 : 4);
  S.waterNeed += hours / (resting ? 5 : 3);
  while (S.foodNeed >= 1) {
    S.foodNeed -= 1;
    if (S.food > 0) S.food--;
    else if (!resting) { S.stam -= 15; log("没有干粮，体力骤降。", "bad"); }
    else { S.stam -= 8; log("夜间饿着睡，恢复打折。", "bad"); }
  }
  while (S.waterNeed >= 1) {
    S.waterNeed -= 1;
    if (S.water > 0) S.water--;
    else if (!resting) { S.stam -= 20; log("严重缺水！", "bad"); }
    else { S.stam -= 10; log("夜间缺水，口干舌燥。", "bad"); }
  }
  S.hour += hours;
  while (S.hour >= 24) { S.hour -= 24; S.day++; }
}

function checkFail() {
  if (S.stam <= 0) {
    endGame(false, "体力耗尽", "你倒在梁上。这一次没有走到终点——但活着下撤也是胜利，下次早作决定。");
    return true;
  }
  return false;
}

function goNext() {
  const from = cur();
  const to = DATA.points[S.idx + 1];
  const risk = Math.max(from.weather_risk, to.weather_risk);
  S.weather = weatherPick(risk);
  const mit = mitigationFor(S.weather.id);
  let hours = to.hours_base * S.weather.mult * (1 - mit.multR);
  const stamCost = Math.round(8 + to.weather_risk * 2 + S.weather.stam + (S.food < 2 ? 3 : 0) + weightStamPenalty() - mit.stamR);
  S.stam = Math.max(0, S.stam - Math.max(3, stamCost));
  tickNeeds(hours);
  const emerg = rollSuddenEmergency(risk);
  if (emerg) applyEmergency(emerg, risk);
  S.idx++;
  if (S.idx === 1) unlock("first_step");
  if (to.id === 29) unlock("peak");
  log(`你从「${from.name}」→「${to.name}」（${to.km_from_prev} km，约 ${hours.toFixed(1)} h）。天气：${S.weather.name}。体力 -${Math.max(3, stamCost)}。`, "evt");
  if (to.notes) log(to.notes, "sys");
  if (checkFail()) return;
  if (to.id === 36) {
    if (!S.spentAny) unlock("no_buy");
    unlock("clear_any");
    if (S.money >= 400) unlock("clear_cheap");
    endGame(true, "主线通关 · Good Ending", `抵达鹦鸽镇！剩余现金 ¥${S.money}。省钱排名看剩余现金——你花得越少越强。`);
    return;
  }
  refreshMeta(); drawMap(); renderActions();
}

function camp() {
  const p = cur();
  const campInfo = canCampHere(p);
  if (!campInfo.ok) {
    log(campInfo.reason, "bad");
    return;
  }
  const block = campFoodWaterOk(8, true);
  if (block) {
    log("无法扎营：" + block, "bad");
    return;
  }
  let bonus = 35;
  if (campInfo.mode === "bivy") bonus = 28;
  ["pad", "bivy", "tarp", "stove", "fuel"].forEach(gid => {
    const def = GAME.gear[gid];
    if (!hasGear(gid) || !def) return;
    if (def.nightBonus) bonus += def.nightBonus;
    if (gid === "stove" && hasGear("fuel")) {
      const fuel = S.gear.fuel;
      if (fuel && fuel.uses > 0) { fuel.uses--; bonus += 3; }
    }
  });
  tickNeeds(8, { resting: true });
  S.stam = Math.min(100, S.stam + bonus);
  S.camps++;
  if (S.camps >= 5) unlock("camp_10");
  S.weather = weatherPick(p.weather_risk);
  const nightEmerg = rollSuddenEmergency(p.weather_risk + 1);
  if (nightEmerg && Math.random() < 0.55) applyEmergency(nightEmerg, p.weather_risk);
  const modeTxt = campInfo.mode === "bivy" ? "应急露宿" : "扎营";
  log(`在「${p.name}」${modeTxt}过夜。体力 +${bonus}，新的一天天气：${S.weather.name}。`, "good");
  if (checkFail()) return;
  refreshMeta(); drawMap(); renderActions();
}

function fillWater() {
  if (!cur().water) return;
  S.water = Math.min(10, S.water + 3);
  log("取到干净的山泉水。饮水 +3。", "good");
  refreshMeta(); renderActions();
}

function buy(wha) {
  const p = cur();
  if (!p.supply) return;
  if (wha === "food") {
    if (S.money < p.price_food) return log("钱不够。", "bad");
    S.money -= p.price_food; S.food += 2; S.spentAny = true;
    log(`买了干粮。-¥${p.price_food}，干粮 +2。`);
  } else if (wha === "water") {
    if (S.money < p.price_water) return log("钱不够。", "bad");
    S.money -= p.price_water; S.water += 2; S.spentAny = true;
    log(`买了瓶装水。-¥${p.price_water}，水 +2。`);
  } else if (wha === "rest") {
    if (S.money < p.price_rest) return log("钱不够。", "bad");
    S.money -= p.price_rest; S.stam = Math.min(100, S.stam + 50); S.spentAny = true;
    tickNeeds(8, { resting: true });
    log(`住店休整。-¥${p.price_rest}，体力大恢复。`, "good");
  }
  refreshMeta(); renderActions();
}

function doRetreat() {
  const p = cur();
  if (!p.retreat) return;
  const r = p.retreat;
  if (S.money < r.cost) {
    log(`下撤需要包车/向导费约 ¥${r.cost}，现金不足。`, "bad");
    return;
  }
  S.money -= r.cost;
  S.spentAny = true;
  tickNeeds(r.hours);
  S.discoveredRetreats.add(r.id);
  const found = JSON.parse(localStorage.getItem("aotai_retreats") || "[]");
  if (!found.includes(r.id)) { found.push(r.id); localStorage.setItem("aotai_retreats", JSON.stringify(found)); }
  if (found.length >= 6) unlock("retreat_explorer");
  unlock("retreat_ok");
  endGame(true, "下撤成功 · Good Ending", `你从「${r.name}」安全出山。花了 ¥${r.cost} 保命，剩余 ¥${S.money}。活着回来也是通关。`);
}

function endGame(good, title, body) {
  S.ended = true;
  refreshMeta(); drawMap(); renderActions();
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endBody").textContent = body;
  const ul = document.getElementById("endAchs");
  ul.innerHTML = "";
  [...S.unlockedThisRun].forEach(id => {
    const li = document.createElement("li");
    li.className = "got";
    li.textContent = ACH_DEFS[id].title + " — " + ACH_DEFS[id].desc;
    ul.appendChild(li);
  });
  document.getElementById("endModal").classList.add("show");
  log(good ? title : title, good ? "good" : "bad");
}

function showAchievements() {
  const got = loadAch();
  const ul = document.getElementById("achList");
  ul.innerHTML = "";
  Object.keys(ACH_DEFS).forEach(id => {
    const li = document.createElement("li");
    if (got[id]) li.className = "got";
    li.textContent = (got[id] ? "✓ " : "○ ") + ACH_DEFS[id].title + " — " + ACH_DEFS[id].desc;
    ul.appendChild(li);
  });
  const found = JSON.parse(localStorage.getItem("aotai_retreats") || "[]");
  const li = document.createElement("li");
  li.textContent = `已发现下撤路径 ${found.length}/6`;
  ul.appendChild(li);
  document.getElementById("achModal").classList.add("show");
}

function showGear() {
  const names = Object.keys(S.gear).map(gid => {
    const def = GAME.gear[gid];
    const g = S.gear[gid];
    let u = def ? def.name : gid;
    if (g && g.uses !== undefined) u += `(${g.uses})`;
    return u;
  });
  log(names.length ? "携带装备：" + names.join("、") : "除基础衣物外无额外装备。", "sys");
}

function renderShop() {
  document.getElementById("shopMoney").textContent = S.money;
  document.getElementById("shopWeight").textContent = totalWeightKg();
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";
  (GAME.shop || []).forEach(item => {
    const owned = item.type === "gear" && hasGear(item.gear);
    const row = document.createElement("div");
    row.className = "shop-row" + (owned ? " owned" : "");
    const wtxt = item.weight ? ` · ${item.weight}kg` : "";
    row.innerHTML = `<div class="info"><b>${item.name}</b> ¥${item.cost}${wtxt}<br/><span>${shopDesc(item)}</span></div>`;
    const btn = document.createElement("button");
    btn.textContent = owned ? "已买" : "购买";
    btn.disabled = owned || S.money < item.cost;
    btn.onclick = () => buyShopItem(item);
    row.appendChild(btn);
    grid.appendChild(row);
  });
}

function shopDesc(item) {
  if (item.type === "food") return "增加干粮";
  if (item.type === "water") return "增加饮水";
  const def = GAME.gear[item.gear];
  if (!def) return "";
  if (def.mitigate) return "应对：" + def.mitigate.map(id => (WEATHERS[id] || { name: id }).name).join("、");
  if (def.campAny) return "允许非营地应急过夜";
  if (def.nightBonus) return "提升过夜恢复";
  return "";
}

function buyShopItem(item) {
  if (S.money < item.cost) return;
  if (item.type === "gear" && hasGear(item.gear)) return;
  S.money -= item.cost;
  if (item.type === "food") S.food += item.amount;
  else if (item.type === "water") S.water += item.amount;
  else if (item.type === "gear") {
    const def = GAME.gear[item.gear] || {};
    const entry = { weight: item.weight || 0 };
    if (def.fuelUses) entry.uses = def.fuelUses;
    else if (def.consumable) entry.uses = def.uses || 3;
    S.gear[item.gear] = entry;
  }
  renderShop();
}

function finishShop() {
  document.getElementById("shopModal").classList.remove("show");
  log("塘口村，清晨。你整理背包，沿火烧坡方向进山。目标：鳌山进、太白出，尽量少花钱走到鹦鸽。", "sys");
  log("左图纵轴示意海拔、横轴示意里程；金色小三角为行进方向（塘口→鹦鸽）。突发天气很常见，留意装备与下撤口。", "sys");
  refreshMeta(); drawMap(); renderActions();
}

const BGM_TITLE = "Ridge Tension（原创）";
let bgmAudio = null;
function ensureBgmAudio() {
  if (bgmAudio) return bgmAudio;
  bgmAudio = new Audio("bgm.mp3");
  bgmAudio.loop = true;
  bgmAudio.volume = 0.45;
  bgmAudio.addEventListener("error", () => {
    log("找不到同目录的 bgm.mp3，请用「选择BGM文件」加载，或把 mp3 放在网页旁。", "bad");
  });
  return bgmAudio;
}
function pickBgmFile() {
  const inp = document.getElementById("bgmFile");
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const a = ensureBgmAudio();
    if (a.src && a.src.startsWith("blob:")) URL.revokeObjectURL(a.src);
    a.src = URL.createObjectURL(f);
    a.play().then(() => { S.bgmOn = true; renderActions(); log("BGM：" + BGM_TITLE + "（已加载本地文件）", "sys"); }).catch(() => log("浏览器拦截了自动播放，再点一次开启 BGM。", "bad"));
  };
  inp.click();
}
function toggleBgm() {
  const a = ensureBgmAudio();
  if (S.bgmOn) { a.pause(); S.bgmOn = false; }
  else {
    a.play().then(() => { S.bgmOn = true; log("BGM：" + BGM_TITLE, "sys"); })
      .catch(() => { log("需手动开启：点 BGM，或选择本地音频。", "sys"); pickBgmFile(); });
  }
  renderActions();
}

function initState() {
  S = {
    idx: 0, money: 600, stam: 100, food: 4, water: 3,
    day: 1, hour: 7, weather: WEATHERS.clear,
    foodNeed: 0, waterNeed: 0, camps: 0, spentAny: false,
    discoveredRetreats: new Set(), unlockedThisRun: new Set(),
    ended: false, bgmOn: false,
    gear: {}, baseWeight: 2.2,
  };
}

async function boot() {
  await loadGameFiles();
  initState();
  renderShop();
}

boot();
</script>
